# ШАБЛОН. Настоящий токен в репозиторий не коммитить —
# этот файл намеренно не подключён в kustomization.yaml.
#
# Создать секрет в кластере:
#   kubectl -n cyprus-signs-bot create secret generic bot-secrets \
#     --from-literal=BOT_TOKEN='123456789:AA...'
#
# Либо через sealed-secrets / external-secrets, если они есть в кластере.
apiVersion: v1
kind: Secret
metadata:
  name: bot-secrets
  namespace: cyprus-signs-bot
type: Opaque
stringData:
  BOT_TOKEN: "ЗАМЕНИТЬ-НА-ТОКЕН-ОТ-BOTFATHER"
