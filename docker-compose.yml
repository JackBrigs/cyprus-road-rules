services:
  bot:
    build: .
    image: cyprus-signs-bot
    env_file: .env
    environment:
      DB_PATH: /app/var/bot.db
    volumes:
      # Прогресс пользователей переживает пересборку образа
      - ./var:/app/var
    restart: unless-stopped
    # SIGTERM обрабатывается aiogram; даём доиграть текущие апдейты
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
