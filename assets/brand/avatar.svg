<?xml version="1.0" encoding="UTF-8"?>
<!-- Аватар бота. Telegram обрезает аватар в круг, поэтому вся значимая
     геометрия держится внутри вписанной окружности (центр 256,256, радиус 256).
     Медный цвет — с флага Кипра, треугольник читается как дорожный знак
     даже в списке чатов размером 40 px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#D57800"/>

  <!-- Предупреждающий треугольник; толстая обводка того же цвета скругляет углы -->
  <polygon points="256,80 424,372 88,372"
           fill="#FFFFFF" stroke="#FFFFFF" stroke-width="34" stroke-linejoin="round"/>

  <!-- Восклицательный знак -->
  <rect x="240" y="176" width="32" height="122" rx="16" fill="#D57800"/>
  <circle cx="256" cy="330" r="19" fill="#D57800"/>
</svg>
